apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-platform-instances
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/anilamara/my_openshift_lab.git'
    path: instances
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
